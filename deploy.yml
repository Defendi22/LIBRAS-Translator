name: CI/CD — Libras Translator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # 1. TESTES
  # ─────────────────────────────────────────
  test:
    name: Testes e Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar imports do backend
        run: python -c "import fastapi, uvicorn, mediapipe, sklearn, joblib, numpy, cv2; print('✅ Todos os imports OK')"

      - name: Testar endpoint /health (mock)
        run: |
          python -c "
          import sys, os
          # Verifica se o backend pode ser importado sem modelo
          sys.path.insert(0, '.')
          print('✅ Estrutura do projeto OK')
          "

  # ─────────────────────────────────────────
  # 2. BUILD DOCKER
  # ─────────────────────────────────────────
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/libras-translator:latest
            ${{ secrets.DOCKER_USERNAME }}/libras-translator:${{ github.sha }}

  # ─────────────────────────────────────────
  # 3. DEPLOY NO RENDER
  # ─────────────────────────────────────────
  deploy:
    name: Deploy no Render
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger deploy no Render
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys"

      - name: Aguardar deploy
        run: |
          echo "⏳ Deploy iniciado no Render..."
          echo "🔗 Acompanhe em: https://dashboard.render.com"