<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tradutor de Libras</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px}
    h1{font-size:1.8rem;font-weight:700;margin-bottom:2px;background:linear-gradient(90deg,#7c3aed,#2563eb);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .subtitle{font-size:.85rem;color:#64748b;margin-bottom:20px}
    .grid{display:grid;grid-template-columns:1fr 320px;gap:16px;width:100%;max-width:1050px}

    /* Câmera */
    .cam-card{background:#1e2130;border-radius:16px;overflow:hidden;position:relative;aspect-ratio:4/3;border:2px solid #2d3148}
    #video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
    .overlay{position:absolute;inset:0;pointer-events:none}
    .hand-box{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:220px;height:260px;border:2px dashed #7c3aed44;border-radius:12px;transition:border-color .15s}
    .hand-box.active{border-color:#7c3aedaa}
    .badge{position:absolute;top:10px;left:10px;padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:600;background:#0f1117bb;border:1px solid #2d3148;backdrop-filter:blur(4px)}
    .badge.on{border-color:#22c55e55;color:#22c55e}
    .badge.off{border-color:#ef444455;color:#ef4444}
    .badge.det{border-color:#f59e0b55;color:#f59e0b}

    /* Letra ao vivo — overlay grande na câmera */
    .live-letter{position:absolute;bottom:12px;right:12px;font-size:5rem;font-weight:900;line-height:1;background:linear-gradient(135deg,#7c3aed,#2563eb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 2px 8px #0008)}

    /* Painel */
    .side{display:flex;flex-direction:column;gap:12px}
    .card{background:#1e2130;border-radius:14px;padding:16px;border:1px solid #2d3148}
    .card-title{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}

    /* Frase */
    .frase{font-size:1.5rem;font-weight:700;letter-spacing:.1em;color:#e2e8f0;min-height:44px;word-break:break-all;padding:6px 4px;border-bottom:2px solid #2d3148;margin-bottom:8px;text-align:center}
    .frase-hint{font-size:.72rem;color:#475569;text-align:center;margin-bottom:10px}

    /* Barra de progresso de estabilização */
    .stab-wrap{height:4px;background:#2d3148;border-radius:99px;overflow:hidden;margin-bottom:8px}
    .stab-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#22c55e);border-radius:99px;width:0%;transition:width .08s linear}

    /* Botões palavra */
    .word-btns{display:flex;gap:6px}
    .wbtn{flex:1;padding:7px;border-radius:8px;border:none;font-size:.8rem;font-weight:600;cursor:pointer}
    .wbtn.del{background:#3b1d1d;color:#f87171}
    .wbtn.spc{background:#1d2d3b;color:#60a5fa}
    .wbtn.clr{background:#2d3148;color:#94a3b8}

    /* Top 5 */
    .t5{display:flex;flex-direction:column;gap:7px}
    .t5-row{display:flex;align-items:center;gap:8px}
    .t5-l{width:22px;font-size:.9rem;font-weight:700;color:#e2e8f0;text-align:center}
    .t5-bar{flex:1;height:7px;background:#2d3148;border-radius:99px;overflow:hidden}
    .t5-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#7c3aed,#2563eb);transition:width .1s ease}
    .t5-pct{width:38px;text-align:right;font-size:.75rem;color:#64748b}

    /* Controles */
    .btn-row{display:flex;gap:8px}
    .btn{flex:1;padding:9px;border-radius:10px;border:none;font-size:.85rem;font-weight:600;cursor:pointer;transition:transform .1s}
    .btn:active{transform:scale(.97)}
    .btn.start{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff}
    .btn.stop{background:#2d3148;color:#94a3b8}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .log{font-size:.72rem;color:#475569;margin-top:6px;min-height:16px}

    @media(max-width:720px){.grid{grid-template-columns:1fr}.live-letter{font-size:3.5rem}}
  </style>
</head>
<body>

<h1>🤟 Tradutor de Libras</h1>
<p class="subtitle">Datilologia em tempo real — letras A–Y</p>

<div class="grid">

  <!-- CÂMERA -->
  <div class="cam-card">
    <video id="video" autoplay playsinline muted></video>
    <div class="overlay">
      <div class="hand-box" id="handBox"></div>
      <div class="badge off" id="badge">⬤ Desconectado</div>
      <div class="live-letter" id="liveLetter"></div>
    </div>
  </div>

  <!-- PAINEL -->
  <div class="side">

    <!-- Frase formada -->
    <div class="card">
      <div class="card-title">Frase formada</div>
      <div class="frase" id="frase">_</div>
      <div class="stab-wrap"><div class="stab-fill" id="stabFill"></div></div>
      <div class="frase-hint">Segure a letra para adicioná-la</div>
      <div class="word-btns">
        <button class="wbtn del" onclick="del()">⌫ Apagar</button>
        <button class="wbtn spc" onclick="spc()">␣ Espaço</button>
        <button class="wbtn clr" onclick="clr()">🗑 Limpar</button>
      </div>
    </div>

    <!-- Top 5 -->
    <div class="card">
      <div class="card-title">Probabilidades em tempo real</div>
      <div class="t5" id="top5"><span style="color:#475569;font-size:.8rem">Aguardando...</span></div>
    </div>

    <!-- Controles -->
    <div class="card">
      <div class="btn-row">
        <button class="btn start" id="btnStart" onclick="startCam()">▶ Iniciar</button>
        <button class="btn stop"  id="btnStop"  onclick="stopCam()" disabled>⏹ Parar</button>
      </div>
      <div class="log" id="log">Clique em Iniciar para começar.</div>
    </div>

  </div>
</div>

<script>
  const WS_URL = location.hostname === "localhost"
    ? "ws://localhost:8000/ws"
    : `wss://${location.host}/ws`;
  const FPS    = 33;  // ~30fps

  // ── Estabilização ──
  // Letra precisa aparecer STABLE_N vezes seguidas para ser adicionada
  const STABLE_N      = 10;   // ~330ms a 30fps
  const COOLDOWN_N    = 15;   // ~500ms entre letras
  const MIN_CONF      = 65;   // confiança mínima para considerar

  let ws, stream, timer;
  let frase       = "";
  let stableCount = 0;
  let lastLetter  = "";
  let cooldown    = 0;

  const video    = document.getElementById("video");
  const badge    = document.getElementById("badge");
  const handBox  = document.getElementById("handBox");
  const liveLet  = document.getElementById("liveLetter");
  const fraseEl  = document.getElementById("frase");
  const stabFill = document.getElementById("stabFill");
  const top5El   = document.getElementById("top5");
  const btnStart = document.getElementById("btnStart");
  const btnStop  = document.getElementById("btnStop");
  const logEl    = document.getElementById("log");

  const canvas = document.createElement("canvas");
  const ctx    = canvas.getContext("2d");

  // ── Câmera ──
  async function startCam() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480, frameRate: 30 },
        audio: false
      });
      video.srcObject = stream;
      btnStart.disabled = true; btnStop.disabled = false;
      log("Câmera iniciada. Conectando...");
      connectWS();
    } catch(e) { log("❌ Câmera: " + e.message); }
  }

  function stopCam() {
    stream?.getTracks().forEach(t=>t.stop()); stream=null;
    ws?.close(); ws=null;
    clearInterval(timer); timer=null;
    video.srcObject=null;
    btnStart.disabled=false; btnStop.disabled=true;
    setBadge("off","⬤ Desconectado");
    log("Parado.");
  }

  // ── WebSocket ──
  function connectWS() {
    ws = new WebSocket(WS_URL);
    ws.onopen    = () => { setBadge("on","⬤ Conectado"); log("Pronto! Posicione sua mão."); startFrames(); };
    ws.onmessage = e => handle(JSON.parse(e.data));
    ws.onerror   = () => log("❌ Backend offline. Rode: python backend/main.py");
    ws.onclose   = () => { setBadge("off","⬤ Desconectado"); clearInterval(timer); };
  }

  // ── Envio de frames ──
  function startFrames() {
    timer = setInterval(() => {
      if (!ws || ws.readyState !== 1 || !stream) return;
      // Resolução reduzida para menor latência
      canvas.width  = 320;
      canvas.height = 240;
      ctx.save(); ctx.scale(-1,1);
      ctx.drawImage(video, -320, 0, 320, 240);
      ctx.restore();
      ws.send(JSON.stringify({ type:"frame", image: canvas.toDataURL("image/jpeg", 0.6) }));
    }, FPS);
  }

  // ── Processar mensagens ──
  function handle(msg) {

    // Sem mão
    if (msg.type === "status") {
      handBox.classList.remove("active");
      setBadge("on","⬤ Conectado");
      liveLet.textContent = "";
      stabFill.style.width = "0%";
      stableCount = 0; lastLetter = "";
      log("Posicione sua mão na câmera.");
      return;
    }

    // Detectando (confiança baixa) — mostra em tempo real mas não adiciona
    if (msg.type === "detecting") {
      handBox.classList.add("active");
      setBadge("det","⬤ Detectando");
      liveLet.textContent = msg.letter;
      liveLet.style.opacity = "0.5";
      renderTop5(msg.top5);
      stableCount = 0; lastLetter = "";
      stabFill.style.width = "0%";
      return;
    }

    // Predição estável
    if (msg.type === "prediction") {
      handBox.classList.add("active");
      setBadge("det","⬤ " + msg.letter);
      liveLet.textContent = msg.letter;
      liveLet.style.opacity = "1";
      renderTop5(msg.top5);

      if (cooldown > 0) { cooldown--; stabFill.style.width="0%"; return; }

      // Estabilização
      if (msg.letter === lastLetter && msg.confidence >= MIN_CONF) {
        stableCount++;
        stabFill.style.width = Math.min(stableCount / STABLE_N * 100, 100) + "%";
        log(`"${msg.letter}" — ${msg.confidence}% — ${stableCount}/${STABLE_N}`);

        if (stableCount >= STABLE_N) {
          addLetra(msg.letter);
          stableCount = 0;
          cooldown    = COOLDOWN_N;
          stabFill.style.width = "0%";
        }
      } else {
        lastLetter  = msg.letter;
        stableCount = 1;
        stabFill.style.width = "0%";
      }
    }

    if (msg.type === "error") log("❌ " + msg.message);
  }

  // ── Frase ──
  function addLetra(l) {
    frase += l;
    renderFrase();
    log(`✅ "${l}" adicionada!`);
  }
  function del() { frase = frase.slice(0,-1); renderFrase(); }
  function spc() { frase += " "; renderFrase(); }
  function clr() { frase = ""; renderFrase(); }
  function renderFrase() { fraseEl.textContent = frase || "_"; }

  // ── Top 5 ──
  function renderTop5(data) {
    if (!data) return;
    top5El.innerHTML = data.map(i => `
      <div class="t5-row">
        <span class="t5-l">${i.letter}</span>
        <div class="t5-bar"><div class="t5-fill" style="width:${i.confidence}%"></div></div>
        <span class="t5-pct">${i.confidence}%</span>
      </div>`).join("");
  }

  // ── Helpers ──
  function setBadge(cls, txt) { badge.className=`badge ${cls}`; badge.textContent=txt; }
  function log(txt) { logEl.textContent=txt; }
</script>
</body>
</html>
